<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password · UTHM Academic Analytics</title><link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin_actions.css') }}"></head><body class="login-page"><main class="account-card"><a class="back-link" href="{{ url_for('login') }}">← Back to sign in</a><p class="eyebrow">SECURE ACCOUNT RECOVERY</p><h1>Reset your password</h1><p class="muted">A six-digit verification code will be sent to your registered email.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}<form class="account-form" method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Registered email<input name="email" type="email" autocomplete="email" required></label><button class="apply-button" type="submit">Send verification code</button></form></main></body></html>
