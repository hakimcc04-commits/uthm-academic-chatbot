<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Email verification · UTHM Academic Analytics</title><link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin_actions.css') }}"></head><body class="login-page"><main class="account-card"><p class="eyebrow">EMAIL VERIFICATION</p><h1>Enter your email code</h1><p class="muted">The code expires in 10 minutes.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}<form class="account-form" method="post"><label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></label><button class="apply-button" type="submit">Verify code</button></form></main></body></html>
